<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Naufal Dzaki — Web Developer and UI/UX Designer</title>
  <desc id="desc">Animated cyber-cyan profile banner for Naufal Dzaki.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.45" stop-color="#0F172A"/>
      <stop offset="0.78" stop-color="#075985"/>
      <stop offset="1" stop-color="#22D3EE"/>
      <animate attributeName="x1" values="0;260;0" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1200;940;1200" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(860 170) rotate(146.5) scale(430 250)">
      <stop stop-color="#22D3EE" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#67E8F9" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="nameGradient" x1="220" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#CFFAFE"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#background)"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="30" fill="url(#glow)"/>

  <path d="M0 292C160 248 276 340 462 300C644 261 743 228 928 272C1047 300 1113 314 1200 286V360H0V292Z"
        fill="#020617" fill-opacity="0.74"/>
  <path d="M0 306C177 266 292 344 468 312C649 278 772 242 940 287C1042 314 1111 326 1200 302"
        stroke="#22D3EE" stroke-opacity="0.50" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.25;0.85;0.25" dur="4s" repeatCount="indefinite"/>
  </path>

  <g opacity="0.95">
    <circle cx="1000" cy="86" r="78" stroke="#67E8F9" stroke-opacity="0.35"/>
    <circle cx="1000" cy="86" r="55" stroke="#22D3EE" stroke-opacity="0.45" stroke-dasharray="8 10">
      <animateTransform attributeName="transform" type="rotate" from="0 1000 86" to="360 1000 86" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="86" r="8" fill="#22D3EE" filter="url(#softGlow)">
      <animate attributeName="r" values="7;11;7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#67E8F9">
    <circle cx="110" cy="90" r="3" opacity="0.75">
      <animate attributeName="cy" values="90;72;90" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="154" cy="142" r="2.5" opacity="0.55">
      <animate attributeName="cy" values="142;124;142" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1086" cy="212" r="3" opacity="0.75">
      <animate attributeName="cy" values="212;190;212" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="250" r="2.5" opacity="0.55">
      <animate attributeName="cy" values="250;232;250" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(100 80)">
    <rect width="210" height="34" rx="17" fill="#020617" fill-opacity="0.72" stroke="#22D3EE" stroke-opacity="0.5"/>
    <circle cx="20" cy="17" r="6" fill="#22C55E" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="22" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">
      OPEN TO COLLABORATE
    </text>
  </g>

  <text x="100" y="181"
        fill="url(#nameGradient)"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="70"
        font-weight="800"
        letter-spacing="5"
        filter="url(#textGlow)">
    NAUFAL DZAKI
  </text>

  <text x="104" y="225"
        fill="#BAE6FD"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="20"
        font-weight="600"
        letter-spacing="2">
    WEB DEVELOPER  •  UI/UX DESIGNER  •  INFORMATION SYSTEMS
  </text>

  <g transform="translate(104 252)">
    <rect width="520" height="40" rx="8" fill="#020617" fill-opacity="0.64" stroke="#164E63"/>
    <text x="18" y="26"
          fill="#E2E8F0"
          font-family="JetBrains Mono, Consolas, monospace"
          font-size="15">
      &gt; turning complex systems into intuitive digital products
    </text>
    <rect x="496" y="13" width="8" height="17" rx="1" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="29" stroke="#67E8F9" stroke-opacity="0.30" stroke-width="2"/>
</svg>
